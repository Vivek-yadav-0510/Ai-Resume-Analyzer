name: Docker Build CI

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and save as artifact
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          builder: default
          push: false
          load: false
          outputs: type=oci,dest=image.oci

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-oci
          path: image.oci

      - name: Run basic container sanity check (optional)
        if: false
        run: |
          docker run --rm -d --name ci-test -p 8501:8501 ghcr.io/OWNER/REPO:latest || true

